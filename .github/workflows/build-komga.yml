name: Build Komga

on:
  push:
    branches:
      - next-ui

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HARBOR_URL: harbor.k3s.internal.strommen.systems
  IMAGE_NAME: production/komga

jobs:
  build:
    runs-on: k3s-runner-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Login to Docker Hub (avoid rate limits)
        continue-on-error: true
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PUSH_TOKEN }}" | \
            docker login --username 'robot$ci-push' --password-stdin \
            "${{ env.HARBOR_URL }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend (bootJar)
        run: ./gradlew :komga:bootJar

      - name: Build Next-UI
        working-directory: next-ui
        run: |
          npm ci
          npm run build

      - name: Prepare Docker context
        run: |
          mkdir -p docker-context
          JAR=$(ls komga/build/libs/komga-*.jar | head -1)
          cp "$JAR" docker-context/application.jar
          cd docker-context
          java -Djarmode=tools -jar application.jar extract --layers --destination extracted

          cat > Dockerfile << 'EOF'
          FROM ubuntu:24.10
          ENV JAVA_HOME=/opt/java/openjdk
          COPY --from=eclipse-temurin:23-jre $JAVA_HOME $JAVA_HOME
          ENV PATH="${JAVA_HOME}/bin:${PATH}"
          RUN sed -i -re 's/([a-z]{2}\.)?archive.ubuntu.com|security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources && \
              apt -y update && \
              apt -y install ca-certificates locales libjxl-dev libheif-dev libwebp-dev libarchive-dev wget curl && \
              echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen && \
              locale-gen en_US.UTF-8 && \
              wget "https://github.com/pgaskin/kepubify/releases/latest/download/kepubify-linux-64bit" -O /usr/bin/kepubify && \
              chmod +x /usr/bin/kepubify && \
              apt -y autoremove && rm -rf /var/lib/apt/lists/*
          ENV LD_LIBRARY_PATH="${LD_LIBRARY_PATH}:/usr/lib/x86_64-linux-gnu"
          VOLUME /config
          WORKDIR /app
          COPY extracted/dependencies/ ./
          COPY extracted/spring-boot-loader/ ./
          COPY extracted/snapshot-dependencies/ ./
          COPY extracted/application/ ./
          ENV KOMGA_CONFIGDIR="/config"
          ENV LANG='en_US.UTF-8' LANGUAGE='en_US:en' LC_ALL='en_US.UTF-8'
          RUN groupadd --system komga && useradd --system --gid komga --no-create-home komga
          USER komga
          ENTRYPOINT ["java", "-Dspring.profiles.include=docker", "--enable-native-access=ALL-UNNAMED", "-jar", "application.jar", "--spring.config.additional-location=file:/config/"]
          EXPOSE 25600
          LABEL org.opencontainers.image.source="https://github.com/zolty-mat/komga"
          EOF

      - name: Build & push to Harbor production
        run: |
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --cache-from type=registry,ref=${{ env.HARBOR_URL }}/${{ env.IMAGE_NAME }}:buildcache \
            --cache-to   type=registry,ref=${{ env.HARBOR_URL }}/${{ env.IMAGE_NAME }}:buildcache,mode=max \
            -t "${{ env.HARBOR_URL }}/${{ env.IMAGE_NAME }}:${SHA_TAG}" \
            -t "${{ env.HARBOR_URL }}/${{ env.IMAGE_NAME }}:latest" \
            --push \
            docker-context/
          echo "Pushed ${{ env.HARBOR_URL }}/${{ env.IMAGE_NAME }}:${SHA_TAG}"
