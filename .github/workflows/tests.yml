name: Tests

on:
  pull_request:
    paths-ignore:
      - 'komga-webui/src/locales/*'
      - 'komga-tray/src/main/resources/org/gotson/komga/*'
  push:
    branches-ignore:
      - 'dependabot/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        os: [ linux ]
      fail-fast: false
    name: Test server - ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          java-package: 'jdk'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build :komga-tray:jar

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: komga/build/test-results/

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ matrix.os }}
          path: komga/build/reports/tests/

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-backend
          path: komga/build/reports/jacoco/

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 'JUnit Test Report: ${{ matrix.os }}'

  webui:
    runs-on: self-hosted
    name: Test webui builds
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: komga-webui/package-lock.json
      - name: npm install
        working-directory: komga-webui
        run: npm install
      - name: npm build
        working-directory: komga-webui
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: npm test
        working-directory: komga-webui
        run: npm run test:unit

  next-ui:
    runs-on: self-hosted
    name: Test next-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: next-ui/package-lock.json

      - name: npm install
        working-directory: next-ui
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: next-ui

      - name: test:unit with coverage
        working-directory: next-ui
        run: npm run test:unit:coverage

      - name: Upload next-ui coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-next-ui
          path: next-ui/coverage/

      - name: test:storybook
        working-directory: next-ui
        run: npm run test:storybook
        env:
          LANG: en_US # fix for https://github.com/microsoft/playwright/issues/34046

      - name: lint
        working-directory: next-ui
        run: npm run lint

      - name: prettier
        working-directory: next-ui
        run: npm run prettier

      - name: type-check
        working-directory: next-ui
        run: npm run type-check

      - name: build
        working-directory: next-ui
        run: npm run build-only
